[package]
name = "rmath-macros"
description = "Procedural macros for the rmath crate (depend on `rmath` instead)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# Only literal parsing is delegated to syn; the math grammar is hand-written (no `full`).
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "printing"] }
