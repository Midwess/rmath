[workspace]
members = ["rmath-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[package]
name = "rmath"
description = "Native math-syntax macros for the Symbolica computer algebra system"
keywords = ["math", "symbolic", "algebra", "macro", "cas"]
categories = ["mathematics", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rmath-macros = { path = "rmath-macros", version = "=0.1.0" }
